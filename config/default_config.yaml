# Web related security and redirect settings

web:
  # 插件加载时是否自动启动
  autoStart: true
  # 监听端口
  port: 12580
  # 绑定地址
  host: "127.0.0.1"
  autoPortScan: true
  trustProxy: false
  # 是否允许将终端打印的验证码也写入日志（默认 false，为了安全建议保持 false）
  showTerminalCode: false
  # 出站请求最大允许的重定向跳数（逐跳校验），设为 0 表示禁止重定向
  maxRedirects: 3
