# AI0-Plugin 配置文件

# 模型配置
model:
  # 默认使用的模型
  default: openai-compatible

  # OpenAI 兼容格式（支持任意兼容此格式的服务）
  # ⚠️ 安全提醒：下面 apiKey 仅为占位示例，请勿填入真实密钥后提交到公开仓库！
  #    建议使用环境变量 AI0_LLM_API_KEY 替代，避免密钥出现在配置文件中。
  openai-compatible:
    name: "AI0模型"
    apiBase: "https://api.openai.com/v1"
    apiKey: "YOUR_API_KEY_HERE"
    model: "gpt-3.5-turbo"
    temperature: 0.8
    maxTokens: 2000
    timeout: 60000
    # 是否支持图片输入（多模态）。
    #   true  → 用户发图片时直接把图片以 image_url 形式发给该模型（如 gpt-4o / qwen-vl / glm-4v / 通义VL 等）。
    #   false → 不看图，收到图片时改用 imageInput.ocr 里配置的视觉模型把图片转成文字，再把文字发给本模型。
    vision: false
    # 是否深度思考模型（如 DeepSeek-R1 / Qwen3 thinking 等）：
    #   true 时① 思考过程会以"聊天记录"形式发送（可关 response.showReasoning）
    #       ② 单次请求超时放宽到 thinkingTimeout（未配则用 timeout，兜底 180s），避免思考被切断
    thinking: false
    # 深度思考模型单次请求超时（毫秒，可选，仅在 thinking:true 时生效）
    thinkingTimeout: 300000
    # 是否启用联网检索能力：
    #   true  → 给该模型注入"可联网检索资料"的说明，并在请求中附带 web 检索工具(web_search)，
    #           模型可主动联网查询后再回答。若所用 API 不支持该工具，会自动回退为不带工具(不报错)。
    #   false → 模型只按已有上下文回答(默认)。
    web: false

# 对话设置
chat:
  # 是否开启群聊艾特回复
  groupAtReply: true
  # 是否开启私聊回复
  privateReply: true
  # 触发前缀（不需要艾特直接触发），留空则只有艾特/私聊触发
  triggerPrefix: []
  # 上下文消息数量（不含当前轮）
  contextSize: 10
  # 单用户最大同时对话数（旧的会被清理）
  maxSessionsPerUser: 3
  # 对话过期时间（毫秒），-1 为永不过期
  sessionTimeout: 1800000

  # --- 上下文增强（默认全部开启，可单独关闭） ---
  # 是否注入"引用消息"（QQ回复/引用按钮选中的那条消息）作为上下文
  includeQuote: true
  # 是否解析"合并转发聊天记录"并把其中每条对话平铺进上下文
  includeForward: true
  # 是否在每条上下文消息前面加上【发送者】标签（便于AI区分谁发的；AI自己之前发的消息会额外带"（AI）"后缀标识）
  includeSenderTag: true
  # true=引用消息以独立的 system 提示块注入（推荐，更不容易被模型当成新一轮提问）
  # false=引用消息按角色注入成普通 user/assistant 对话
  quoteAsSystem: true

  # --- 全局AI模式 ---
  # 开启后，在下方 globalAIGroups 列表中的群，不需要@机器人也会回复所有消息
  # 关闭时，群聊中仅回复@机器人的消息（即 groupAtReply 逻辑）
  globalAI: false
  # 启用全局AI的群号列表（仅在这些群中，globalAI=true 时生效）
  globalAIGroups: []
  # 全局AI模式下忽略的消息前缀（以这些开头的消息不触发AI回复，比如命令）
  globalAIIgnorePrefix: ['#', '/', '！']

  # --- 多模型并行回答 + 模型间互聊 ---
  # 一条用户消息同时交给"所有已配置模型"各自回答（每个模型各用一份独立入参，
  # 可以共用同一份历史上下文）。开启 multiChat 后，还会把其他模型的回复以
  # "[*] 机器人消息" 的形式各自注入，让模型能看到彼此发言、选择追加点评或保持沉默。
  # 需求背景：用户想让多个不同 AI 就同一个问题各自作答，并允许它们相互聊天。
  multiModel:
    # 总开关：关闭时走原有"单一默认模型"链路，功能零影响。
    enabled: false
    # 是否让模型之间互相看到彼此的回答并发起聊天。
    #   true  → 每个模型都能看到其他模型的回复（带 [*] 前缀标记），可回应可忽略，形成"AI 群聊"。
    #   false → 各模型只回答用户问题，互不可见。
    multiChat: false
    # 群操作「同行评审」：多模型互聊开启时，AI 回复里带出的群操作（封禁/踢人/禁言等）
    # 在执行前会转发给【其他模型】做一致性确认。任一确认模型否决/出错/未明确 → 该操作取消。
    #   true（推荐）→ 仅当 multiChat=true 且至少 2 个可用模型时才生效；单模型或多聊关闭不介入。
    #   false → 关闭确认，群操作直接按权限校验执行（不推荐，易被单模型误判触发高危操作）。
    groupConfirm: true
    # 是否允许用 "/<模型名>" 艾特特定模型，把消息单独转发给它、让其立即回应。
    #   true  → 消息如 "/deepseek 你的这个观点我并不认同" 会只发给 deepseek 模型并立即回应，
    #           其他模型本轮也能看到这次追问(可选接话或保持沉默)。
    #   false → 关闭艾特；"/xxx" 会被当作普通文本。
    atModel: true

  # --- 防 AI 互聊无限循环 ---
  # 一个群里若同时存在多个机器人（本插件或其他 AI 插件），它们可能互相 @ 回复形成自激循环，
  # 直到模型欠费或手动停止，白烧 token/余额。下面参数用于自动打断这类循环：
  #   在 windowMs 窗口内，同一群同一账号被我们连续触发回复达 maxReplies 次，
  #   即判定为疑似双机/多机互聊，进入 cooldownMs 的静默冷却；冷却期间忽略该账号在群里的触发。
  # 正常人类间歇聊天间隔远大于窗口，几乎不会误触发；如仍有误判，可调大 windowMs / maxReplies。
  loopGuard:
    # 总开关
    enabled: true
    # 检测窗口（毫秒），默认 20 秒
    windowMs: 20000
    # 窗口内最多连续回复次数，超出则判定为循环并进入冷却
    maxReplies: 4
    # 判定为循环后的静默冷却时长（毫秒）
    cooldownMs: 60000

# 群操作设置（踢出/禁言/设置管理员/授头衔）
groupOps:
  # 总开关
  enabled: true
  # 允许踢出群员（仅群主/管理员/机器人主人可发起；不可对群主/管理员/机器人主人使用）
  allowKick: true
  # 允许禁言群员（同上权限限制）
  allowMute: true
  # 允许设置/取消管理员（仅机器人主人可发起；机器人必须是群主）
  allowAdmin: true
  # 允许授予群成员头衔（群内所有人都能自助申请）
  allowTitle: true
  # 默认禁言时长（秒），不指定时使用
  defaultMuteDuration: 600
  # QQ 协议适配器（NapCat/LLOneBot/ICQQ/XRK 等）成员角色/群信息接口调用超时（毫秒）。
  # 协议端掉线或风控时，这些方法可能既不返回也不报错；这里统一强制超时，
  # 避免 buildIdentityContext/buildGroupContext 无限 pending 把整条群聊 AI 链路卡死。
  apiTimeoutMs: 5000
  # 群角色/群信息接口完全未返回时，身份/角色类问题是否走本地固定文案兜底。
  # 开启后这类问题不再交给 AI 自由发挥（AI 可能不遵守指令反而闲聊身份），改为直接回固定句。
  hardIdentityFallback: true
  # 是否对每条群消息都构建并注入"群身份上下文"（会请求群信息接口）。
  # false（默认）＝智能预判：仅当消息疑似涉及身份/角色/群信息时才构建，
  #   避免"你好"等日常闲聊也去请求接口、且被模型把群资料整段复述/播报出来。
  # true ＝恢复旧行为：无条件注入（若你的身份问题用词较随意、担心预判漏判再开启）。
  injectIdentityAlways: false
  # —— AI 群操作开关（可独立禁用高危操作）——
  # 允许全体禁言（mute_all）
  allowMuteAll: true
  # 允许定时禁言（timed_mute）
  allowMuteTimed: true
  # 允许修改群名
  allowGroupName: true
  # 允许修改群公告
  allowNotice: true
  # 允许修改头衔展示模式
  allowTitleDisplay: true
  # 允许群搜索
  allowSearch: true
  # 允许拉黑
  allowBlacklist: true
  # 允许自定义头衔
  allowCustomTitle: true
  # 允许等级头衔
  allowLevelTitle: true

# 图片生成设置
imageGen:
  # 是否启用图片生成功能
  enabled: false
  # 生图模型 API 地址（OpenAI 兼容 /images/generations 接口）
  apiBase: "https://api.openai.com/v1"
  # API 密钥
  apiKey: ""
  # 模型 ID（如 dall-e-3、dall-e-2、或其他兼容服务提供的模型名）
  model: "dall-e-3"
  # 默认图片尺寸（部分模型支持 1024x1024、1792x1024、1024x1792）
  defaultSize: "1024x1024"
  # 默认图片质量（仅 dall-e-3 支持 standard/hd，其他模型忽略）
  quality: "standard"
  # 生成超时（毫秒）
  timeout: 120000

# 图片输入设置（接收用户发的图片）
# 处理策略：主对话模型 vision=true → 直接把图发给它；vision=false → 用它把图转成文字再发给主模型。
# 注：图片输入不会主动启用，收到图片即触发；前提是 NapCat/适配器能收到图片段（type=image）。
imageInput:
  # 是否启用图片输入。false 时不处理任何用户图片（维持旧行为，只保留 [图片] 占位）。
  enabled: true
  # 主对话模型不支持视觉（vision=false）时，是否把"图片转出的文字"作为用户消息文本一起发给主模型。
  #   true  → 用下方 ocr 视觉模型把图片文字提取出来，附在用户消息里，让主模型"间接看图"。
  #   false → 主模型不理会图片内容，仅保留 [图片] 占位。
  ocrToText: true
  # 图片识别/转文字用的视觉模型（OpenAI 兼容 chat/completions 接口，支持 image_url 输入）。
  # 当主对话模型 vision=false 且 ocrToText=true 时会用它把图片里文字转成文本。
  ocr:
    apiBase: "https://api.openai.com/v1"
    apiKey: ""
    model: "gpt-4o-mini"
    # OCR 单次请求超时（毫秒）
    timeout: 60000
    # 给 OCR 模型的系统提示：让它只输出图里的文字
    systemPrompt: "你是OCR工具，请把输入图片里的所有文字完整、逐行地提取出来。只输出提取到的文字，不要任何解释、前缀或闲聊。若图里没有文字，输出：<无文字>"

# Agent 能力设置（AI 在受控沙箱工作区执行命令完成任务，仅主人可触发）
agent:
  # 是否启用 Agent 能力。默认关闭（P0 安全策略）：首次安装需主人手动开启。
  # 开启后主人会话可获得在受控沙箱执行命令的能力；非主人一律不注入（masterOnly 门控）
  enabled: false
  # 仅允许主人（permissions.masters）触发。命令执行权限较高，默认仅主人
  masterOnly: true
  # 单次任务最大执行轮数（AI 出命令→执行→回传 为一轮，>=1，无硬上限截断，受 API 配额/超时约束）。
  # 网页后台可配置，默认 5：低配额 API（如 RPM≤3）建议 2~3；高配额可 5~8 或更大
  maxRounds: 5
  # 单条命令超时（毫秒）
  commandTimeout: 30000
  # 两次 LLM 调用之间的最小间隔（毫秒）：多轮循环连续调用间隔过短会触发上游速率限制，可按需调大
  callIntervalMs: 1000
  # 额外允许的命令（追加白名单，如：gcc、make）
  extraAllowedCommands: []
  # 额外禁止的命令（追加黑名单，正则表达式，如：["gcc"]）
  extraDeniedPatterns: []

# 系统提示词
system:
  prompt: |
    你是一个友善、乐于助人的AI助手，正在通过QQ机器人与用户交流。
    请用简洁、自然的中文回答用户的问题。
    - 如果涉及违规/违法/敏感内容，请直接拒绝回答。
    - 保持礼貌，适度使用颜文字和emoji。
    - 不要主动透露你是基于什么模型运行的。

# 白名单/黑名单
permissions:
  # true: 白名单模式（只有列表内可用），false: 黑名单模式
  whitelistMode: false
  # 允许的用户QQ号（白名单模式生效）
  allowedUsers: []
  # 允许的群号（白名单模式生效）
  allowedGroups: []
  # 禁止的用户QQ号（黑名单模式生效）
  blockedUsers: []
  # 禁止的群号（黑名单模式生效）
  blockedGroups: []
  # 主人QQ（可以执行管理命令）
  masters: []

# 响应设置
response:
  # 是否使用转发消息（长文本时）
  useForwardMsg: true
  # 超过多少字使用转发（设大则禁用）
  forwardThreshold: 500
  # 是否在回复前发送「我正在思考中...」占位提示。默认关闭（只输出AI纯回复）
  showThinkingHint: false
  # 如果开启了 showThinkingHint，延迟多少毫秒后发送占位提示（避免回复很快时一闪而过）。0=立刻发
  thinkingDelay: 500
  # 是否在回复末尾追加模型名（如"\n\n—— AI0模型"）。默认关闭，只输出AI纯回复
  showModelTag: false
  # 是否把深度思考模型的思考过程以"聊天记录"（合并转发）形式发送。默认开启
  showReasoning: true

# 网页管理后台
web:
  # 插件加载时是否自动启动
  autoStart: true
  # 监听端口
  port: 12580
  # 绑定地址（建议加引号，避免部分 YAML 解析器把裸 0.0.0.0 当成数字 0）：
  #   "127.0.0.1"  仅本机访问（默认）
  #   "0.0.0.0"    允许局域网/公网访问（请同时放行 云服务器安全组 + 系统防火墙 TCP 端口）
  #   "::"         IPv6 all（同上）
  host: "127.0.0.1"
  # 是否信任反向代理的 X-Forwarded-For / X-Real-IP / CF-Connecting-IP 头。
  #  仅当你已经在前面架了 Nginx/Caddy/Cloudflare 并正确设置头时才设为 true。
  trustProxy: false
  # 可信代理来源网段（仅当 trustProxy=true 时生效，配合上面的头来还原真实客户端 IP）。
  #  安全说明：只有请求确实来自这些代理时才会信任转发头，否则攻击者可伪造 XFF 绕过 IP 绑定/限速。
  #  默认 ["127.0.0.1","::1"]（回环），即反向代理与插件部署在同一台机器，无需配置。
  #  若反向代理在其他机器/网段，如 Nginx 在 10.0.0.10：trustedProxies: ["10.0.0.10"]
  trustedProxies: []
