<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>AI0 · App 管理</title>
<style>
:root { color-scheme: dark; --bg:#0b0d10; --card:#141920; --line:rgba(255,255,255,.09); --fg:#e9eef5; --muted:rgba(255,255,255,.55); --acc:#4c8dff; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
h1 { font-size:20px; margin:0 0 2px; }
.sub { color:var(--muted); font-size:12.5px; margin-bottom:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
.row { display:flex; justify-content:space-between; gap:12px; align-items:center; }
.kv { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.06); font-size:14px; }
.kv:last-child { border-bottom:none; }
.kv b { font-weight:600; }
.muted { color:var(--muted); }
.model { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06); }
.model:last-child { border-bottom:none; }
.model .name { flex:1; min-width:0; }
.model .tag { font-size:11px; padding:2px 7px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--muted); }
.model .tag.on { background:rgba(76,141,255,.18); color:#8fb6ff; }
.model .tag.v { background:rgba(80,220,140,.15); color:#6fe3a1; }
button { border:none; border-radius:10px; background:var(--acc); color:#fff; padding:8px 12px; font-size:13px; }
button:disabled { opacity:.5; }
button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
.head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.err { color:#ff9a9a; font-size:13px; }
.foot { text-align:center; color:rgba(255,255,255,.3); font-size:12px; margin-top:18px; }
</style>
</head>
<body>
  <div class="head">
    <div>
      <h1>App 管理</h1>
      <div class="sub">不打开网页后台也能管理</div>
    </div>
    <button class="ghost" id="refresh">刷新</button>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px"><b>App 绑定</b><button id="genPair" style="padding:6px 12px">生成绑定码</button></div>
    <div id="pairBody" style="display:none">
      <div style="display:flex;gap:14px;align-items:center">
        <div id="bindQr" style="background:#fff;padding:8px;border-radius:8px;flex:0 0 auto;line-height:0"></div>
        <div style="min-width:0">
          <div class="muted" style="font-size:12px">绑定码 · 10 分钟有效 · 一次性</div>
          <div id="bindCode" style="font-size:22px;letter-spacing:3px;font-weight:700;margin:6px 0">--------</div>
          <div class="muted" id="bindTtl" style="font-size:12px"></div>
          <div class="muted" style="font-size:12px;margin-top:6px">在 App「绑定码登录」里输入，或用系统相机扫码自动绑定</div>
        </div>
      </div>
    </div>
    <div class="muted" id="bindMsg" style="font-size:12px;margin-top:6px">生成后 10 分钟内有效，绑定一次即失效</div>
  </div>

  <div class="card" id="statusCard"><div class="muted">加载中…</div></div>
  <div class="card">
    <div class="row" style="margin-bottom:6px"><b>模型</b><span class="muted" id="modelHint"></span></div>
    <div id="modelList"><div class="muted">加载中…</div></div>
  </div>
  <div class="foot">ai0-APP · App 管理 v1.0.0</div>

<script src="qrcode.js"></script>
<script>
const API = '/api/ext/app-manager';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function csrf() {
  const m = document.cookie.split(';').map(x => x.trim()).find(x => x.startsWith('ai0_csrf='));
  return m ? decodeURIComponent(m.split('=').slice(1).join('=')) : '';
}
async function api(path, opts = {}) {
  const o = { credentials: 'same-origin', headers: { 'Accept': 'application/json' } };
  if (opts.body) { o.method = 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); o.headers['X-CSRF-Token'] = csrf(); }
  const r = await fetch(API + path, o);
  const t = await r.text();
  try { return JSON.parse(t); } catch (_) { return { ok: false, msg: '返回异常(' + r.status + ')' }; }
}
async function load() {
  const card = $('#statusCard'), list = $('#modelList'), hint = $('#modelHint');
  card.innerHTML = '<div class="muted">加载中…</div>';
  try {
    const s = await api('/status');
    if (!s.ok) throw new Error(s.msg || '状态读取失败');
    card.innerHTML =
      '<div class="kv"><span class="muted">默认模型</span><b>' + esc(s.plugin.defaultModel || '未设置') + '</b></div>' +
      '<div class="kv"><span class="muted">模型数量</span><b>' + esc(s.plugin.modelCount) + '</b></div>' +
      '<div class="kv"><span class="muted">Agent</span><b>' + (s.plugin.agentEnabled ? '已开启' : '已关闭') + '</b></div>' +
      '<div class="kv"><span class="muted">AI 群</span><b>' + esc(s.plugin.groupCount) + ' 个</b></div>';

    const m = await api('/models');
    if (!m.ok) throw new Error(m.msg || '模型读取失败');
    hint.textContent = '共 ' + m.list.length + ' 个';
    list.innerHTML = m.list.length ? m.list.map(function (x) {
      return '<div class="model">' +
        '<div class="name"><div>' + esc(x.name) + (x.isDefault ? ' <span class="tag on">默认</span>' : '') + '</div>' +
        '<div class="muted" style="font-size:12px">' + esc(x.key) + (x.hasKey ? '' : ' · 未配置密钥') + '</div></div>' +
        (x.vision ? '<span class="tag v">识图</span>' : '') +
        (x.isDefault ? '' : '<button data-key="' + esc(x.key) + '">设为默认</button>') +
      '</div>';
    }).join('') : '<div class="muted">还没有配置模型</div>';
    list.querySelectorAll('button[data-key]').forEach(function (b) {
      b.addEventListener('click', function () { setDefault(b.getAttribute('data-key'), b); });
    });
  } catch (e) {
    card.innerHTML = '<div class="err">' + esc(e.message || e) + '</div>';
  }
}
async function setDefault(key, btn) {
  btn.disabled = true; btn.textContent = '保存中…';
  const r = await api('/default-model', { body: { key: key } });
  if (!r.ok) { alert(r.msg || '切换失败'); btn.disabled = false; btn.textContent = '设为默认'; return; }
  await load();
}
$('#refresh').addEventListener('click', load);
let pairTimer = null;
async function genPair() {
  const btn = $('#genPair'), msg = $('#bindMsg');
  btn.disabled = true; btn.textContent = '生成中…';
  const r = await api('/pair-code', { body: {} });
  btn.disabled = false; btn.textContent = '重新生成';
  if (!r.ok) { msg.textContent = r.msg || '生成失败'; return; }
  $('#pairBody').style.display = '';
  $('#bindCode').textContent = r.code;
  msg.textContent = '已生成，请尽快绑定';
  try {
    const data = 'ai0://bind?u=' + encodeURIComponent(location.origin + '/') + '&c=' + r.code;
    const qr = qrcode(0, 'M'); qr.addData(data); qr.make();
    $('#bindQr').innerHTML = qr.createSvgTag(4, 2);
  } catch (e) { $('#bindQr').innerHTML = ''; }
  let left = r.ttl || 600;
  if (pairTimer) clearInterval(pairTimer);
  pairTimer = setInterval(function () {
    left--;
    if (left <= 0) { clearInterval(pairTimer); $('#bindTtl').textContent = '已过期，请重新生成'; return; }
    $('#bindTtl').textContent = '剩余 ' + Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
  }, 1000);
}
$('#genPair').addEventListener('click', genPair);

load();
</script>
</body>
</html>
